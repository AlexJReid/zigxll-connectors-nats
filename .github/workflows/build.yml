name: Build

on:
  push:
    tags:
      - 'v[0-9]*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NATS_C_VERSION: "3.12.0"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Install Trusted Signing Client
      shell: pwsh
      run: |
        nuget install Microsoft.ArtifactSigning.Client -OutputDirectory .\packages

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.15.1

    - name: Build XLL (no TLS)
      run: zig build --release=small -Dtls=false

    - name: Rename no-TLS build
      shell: pwsh
      run: |
        Copy-Item "zig-out\lib\zigxll-connectors-nats.xll" "zigxll-connectors-nats-notls.xll"

    - name: Build XLL (with TLS)
      run: |
        zig build --release=small -Dtls=true

    - name: Sign XLLs
      shell: pwsh
      run: |
        $dlib = Get-ChildItem -Path ".\packages" -Recurse -Filter "Azure.CodeSigning.Dlib.dll" |
          Where-Object { $_.FullName -like "*x64*" } |
          Select-Object -First 1 -ExpandProperty FullName

        Write-Host "DLib path: $dlib"

        $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
          Select-Object -First 1 -ExpandProperty FullName

        Write-Host "SignTool path: $signtool"

        & $signtool sign /v /fd SHA256 `
          /tr "http://timestamp.acs.microsoft.com" /td SHA256 `
          /dlib "$dlib" `
          /dmdf ".\signing-metadata.json" `
          "zig-out\lib\zigxll-connectors-nats.xll"

        & $signtool sign /v /fd SHA256 `
          /tr "http://timestamp.acs.microsoft.com" /td SHA256 `
          /dlib "$dlib" `
          /dmdf ".\signing-metadata.json" `
          "zigxll-connectors-nats-notls.xll"

    - name: Upload XLL artifact (TLS)
      uses: actions/upload-artifact@v4
      with:
        name: zigxll-connectors-nats
        path: zig-out/lib/zigxll-connectors-nats.xll
        if-no-files-found: error

    - name: Upload XLL artifact (no TLS)
      uses: actions/upload-artifact@v4
      with:
        name: zigxll-connectors-nats-notls
        path: zigxll-connectors-nats-notls.xll
        if-no-files-found: error

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          zig-out/lib/zigxll-connectors-nats.xll
          zigxll-connectors-nats-notls.xll
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
